name: ESP-IDF Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ESP32-C3 Firmware
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone ESP-IDF v5.0.15 (Stable)
        run: |
          # Remove existing esp-idf if any (from submodule)
          rm -rf esp-idf
          # Clone stable ESP-IDF version v5.0.15
          git clone --recursive --depth 1 --branch v5.0.15 https://github.com/espressif/esp-idf.git esp-idf

      - name: Install ESP-IDF
        run: |
          cd esp-idf
          ./install.sh esp32c3

      - name: Prepare SDK Config
        run: |
          if [ ! -f "sdkconfig" ] && [ -f "sdkconfig.defaults" ]; then
            cp sdkconfig.defaults sdkconfig
          fi
          ls -la

      - name: Configure Project
        run: |
          source ./esp-idf/export.sh
          idf.py set-target esp32c3
          idf.py reconfigure

      - name: Build Project
        run: |
          source ./esp-idf/export.sh
          idf.py build
          echo "Build completed"

      - name: List Build Outputs
        run: |
          echo "=== Build directory contents ==="
          ls -lh build/
          echo ""
          echo "=== Bootloader ==="
          ls -lh build/bootloader/ 2>/dev/null || echo "No bootloader directory"
          echo ""
          echo "=== Partition table ==="
          ls -lh build/partition_table/ 2>/dev/null || echo "No partition_table directory"
          echo ""
          echo "=== Application binary ==="
          ls -lh build/softap_mqtt.bin 2>/dev/null || ls -lh build/*.bin 2>/dev/null | grep -v bootloader | grep -v partition || echo "No app binary found"

      - name: Create Merged Binary
        if: success()
        run: |
          source ./esp-idf/export.sh
          
          # Find the main app binary
          if [ -f "build/softap_mqtt.bin" ]; then
            APP_BIN="build/softap_mqtt.bin"
          else
            APP_BIN=$(ls build/*.bin 2>/dev/null | grep -v bootloader | grep -v partition | head -1)
          fi
          
          if [ -f "build/bootloader/bootloader.bin" ] && [ -f "build/partition_table/partition-table.bin" ] && [ -n "$APP_BIN" ]; then
            echo "Merging firmware files..."
            echo "  - Bootloader: build/bootloader/bootloader.bin"
            echo "  - Partition: build/partition_table/partition-table.bin"
            echo "  - App: $APP_BIN"
            
            python -m esptool --chip esp32c3 merge_bin -o build/merged.bin \
              --flash_mode dio --flash_size 4MB --flash_freq 80m \
              0x0 build/bootloader/bootloader.bin \
              0x8000 build/partition_table/partition-table.bin \
              0x10000 "$APP_BIN"
              
            echo "=== Merged firmware created ==="
            ls -lh build/merged.bin
          else
            echo "Cannot create merged binary - missing files"
            echo "  bootloader: $(test -f build/bootloader/bootloader.bin && echo OK || echo MISSING)"
            echo "  partition: $(test -f build/partition_table/partition-table.bin && echo OK || echo MISSING)"
            echo "  app: ${APP_BIN:-NOT FOUND}"
          fi

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware-${{ github.sha}}
          path: |
            build/merged.bin
            build/*.bin
            build/*.elf
          if-no-files-found: warn
          retention-days: 30

      - name: Build Summary
        if: always()
        run: |
          echo "## Build Result Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ -f "build/merged.bin" ]; then
            SIZE=$(ls -lh build/merged.bin | awk '{print $5}')
            echo "| Merged Binary | ✅ Created ($SIZE) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Merged Binary | ⚠️ Not created |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f "build/softap_mqtt.elf" ]; then
            echo "| ELF File | ✅ Available |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**ESP-IDF Version**: v5.0.15 (Stable)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
