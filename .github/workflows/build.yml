name: ESP-IDF Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ESP32-C3 Firmware
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESP-IDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git wget flex bison gperf python3 python3-pip python3-venv \
            cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0 \
            python3-setuptools

      - name: Download ESP-IDF
        run: |
          mkdir -p ~/esp
          cd ~/esp
          wget -q https://dl.espressif.com/dl/esp-idf/esp-idf-v5.2.2.zip
          unzip -q esp-idf-v5.2.2.zip
          rm esp-idf-v5.2.2.zip
          mv esp-idf-v5.2.2 esp-idf

      - name: Install ESP-IDF tools
        run: |
          export IDF_PATH=~/esp/esp-idf
          export PATH="$IDF_PATH/tools:$PATH"
          $IDF_PATH/install.sh esp32c3

      - name: Configure and Build Project
        run: |
          source ~/esp/esp-idf/export.sh
          idf.py set-target esp32c3
          idf.py build

          ls -la build/
          ls -la build/bootloader/ 2>/dev/null || true
          ls -la build/partition_table/ 2>/dev/null || true
          
      - name: Create Merged Binary
        run: |
          source ~/esp/esp-idf/export.sh
          if [ -f "build/bootloader/bootloader.bin" ] && [ -f "build/partition_table/partition-table.bin" ] && [ -f "build/softap_mqtt.bin" ]; then
            echo "Merging firmware files..."
            python -m esptool --chip esp32c3 merge_bin -o build/merged.bin \
              --flash_mode dio --flash_size 4MB --flash_freq 80m \
              0x0 build/bootloader/bootloader.bin \
              0x8000 build/partition_table/partition-table.bin \
              0x10000 build/softap_mqtt.bin
          elif ls build/*.bin 1>/dev/null 2>&1; then
            MAIN_BIN=$(ls build/*.bin | head -1)
            echo "Using main binary: $MAIN_BIN"
            cp "$MAIN_BIN" build/merged.bin
          fi
          
          ls -lh build/
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: |
            build/merged.bin
            build/*.bin
            build/*.elf
          if-no-files-found: warn
          retention-days: 30
