name: ESP-IDF Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ESP32-C3 Firmware
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone ESP-IDF v5.1.2 (Stable)
        run: |
          rm -rf esp-idf
          git clone --recursive --depth 1 --branch v5.1.2 https://github.com/espressif/esp-idf.git esp-idf

      - name: Install ESP-IDF
        run: |
          cd esp-idf
          ./install.sh esp32c3

      - name: Prepare SDK Config
        run: |
          if [ ! -f "sdkconfig" ] && [ -f "sdkconfig.defaults" ]; then
            cp sdkconfig.defaults sdkconfig
          fi

      - name: Configure Project
        run: |
          source ./esp-idf/export.sh
          idf.py set-target esp32c3
          idf.py reconfigure

      - name: Build Project
        run: |
          source ./esp-idf/export.sh
          idf.py build

      - name: Create Merged Binary
        if: success()
        run: |
          source ./esp-idf/export.sh
          
          if [ -f "build/bootloader/bootloader.bin" ] && [ -f "build/partition_table/partition-table.bin" ]; then
            if [ -f "build/softap_mqtt.bin" ]; then
              APP_BIN="build/softap_mqtt.bin"
            else
              APP_BIN=$(ls build/*.bin 2>/dev/null | grep -v bootloader | grep -v partition | head -1)
            fi
            
            if [ -n "$APP_BIN" ]; then
              # OTA merged firmware (bootloader + partition table + ota_data + app)
              # This is the primary firmware for flashing via esptool
              if [ -f "build/ota_data_initial.bin" ]; then
                esptool.py --chip esp32c3 merge_bin -o build/ota_merged.bin \
                  --flash_mode dio --flash_size 4MB --flash_freq 80m \
                  0x0 build/bootloader/bootloader.bin \
                  0x8000 build/partition_table/partition-table.bin \
                  0xF000 build/ota_data_initial.bin \
                  0x20000 "$APP_BIN"
                echo "=== OTA merged firmware created ==="
                ls -lh build/ota_merged.bin
              fi
            fi
          fi

      - name: Rename and Organize Artifacts
        if: success()
        run: |
          mkdir -p build/artifacts
          
          # Primary firmware for esptool flashing (OTA partition layout)
          if [ -f "build/ota_merged.bin" ]; then
            cp build/ota_merged.bin build/artifacts/firmware.bin
          fi
          
          # App-only binary for Web OTA upload
          if [ -f "build/softap_mqtt.bin" ]; then
            cp build/softap_mqtt.bin build/artifacts/app.bin
          fi
          
          # Bootloader
          if [ -f "build/bootloader/bootloader.bin" ]; then
            cp build/bootloader/bootloader.bin build/artifacts/bootloader.bin
          fi
          
          # Partition table
          if [ -f "build/partition_table/partition-table.bin" ]; then
            cp build/partition_table/partition-table.bin build/artifacts/partition-table.bin
          fi
          
          echo "=== Artifacts organized ==="
          ls -lh build/artifacts/

      - name: Upload Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware-${{ github.sha}}
          path: build/artifacts/
          if-no-files-found: warn
          retention-days: 30
