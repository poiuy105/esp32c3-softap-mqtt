name: ESP-IDF Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build ESP32-C3 Firmware
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.2
          target: esp32c3

      - name: Configure and Build Project
        id: build
        run: |
          # Set target and build
          idf.py set-target esp32c3
          idf.py build

          # Show build directory
          ls -la build/
          ls -la build/bootloader/ 2>/dev/null || true
          ls -la build/partition_table/ 2>/dev/null || true
          
      - name: Create Merged Binary
        run: |
          # Merge the firmware files if they exist
          if [ -f "build/bootloader/bootloader.bin" ] && [ -f "build/partition_table/partition-table.bin" ] && [ -f "build/softap_mqtt.bin" ]; then
            echo "Merging firmware files..."
            python -m esptool --chip esp32c3 merge_bin -o build/merged.bin \
              --flash_mode dio --flash_size 4MB --flash_freq 80m \
              0x0 build/bootloader/bootloader.bin \
              0x8000 build/partition_table/partition-table.bin \
              0x10000 build/softap_mqtt.bin
          elif ls build/*.bin 1>/dev/null 2>&1; then
            # If no separate files, try to find the main bin
            MAIN_BIN=$(ls build/*.bin | head -1)
            echo "Using main binary: $MAIN_BIN"
            cp "$MAIN_BIN" build/merged.bin
          fi
          
          ls -lh build/
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware
          path: |
            build/merged.bin
            build/*.bin
            build/*.elf
          if-no-files-found: warn
          retention-days: 30
